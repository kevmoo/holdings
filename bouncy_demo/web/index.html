<body>
<script>
    {{flutter_js}}
    {{flutter_build_config}}
    const userConfig = {'wasmAllowList': {'gecko': true, 'webkit': true}};
    const searchParams = new URLSearchParams(window.location.search);
    const mode = searchParams.get('mode');
    if (mode === 'canvaskit') {
        userConfig.renderer = 'canvaskit';
    } else if (mode === 'wimp') {
        userConfig.enableWimp = true;
    } else if (mode === 'skwasm-st') {
        userConfig.forceSingleThreadedSkwasm = true;
    } else if (mode === 'webparagraph') {
        userConfig.renderer = 'canvaskit';
        userConfig.preferWebParagraph = true;
    }
    if (searchParams.get('webparagraph') === 'true') {
        userConfig.preferWebParagraph = true;
    }
    _flutter.loader.load({config: userConfig});
</script>
